interface: eth0
metrics_addr: "0.0.0.0:9500"
health_interval_secs: 3
health_timeout_ms: 500

weighting:
  endpoint: "http://mimir.internal:9090"
  query: |
    100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[1m])) * 100)
  mode: proportional
  instance_label: instance
  interval_secs: 15
  timeout_ms: 2000
  min_weight: 1
  max_weight: 16

rate_limit:
  new_flows_per_second: 10000
  burst: 20000

services:
  - name: web
    vip: 10.0.0.100
    port: 80
    protocol: tcp
    backends:
      - address: 10.0.0.11
        port: 8080
        weight: 1
      - address: 10.0.0.12
        port: 8080
        weight: 1
        drain: false
        metrics_instance: "backend-b.internal"
