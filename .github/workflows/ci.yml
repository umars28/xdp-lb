name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev

      - name: Record the environment under test
        run: |
          uname -r
          clang --version | head -1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --all-targets

      - name: Control plane tests
        run: cargo test

      - name: Datapath tests through BPF_PROG_TEST_RUN
        run: |
          BIN=$(cargo test --test datapath --no-run --message-format=json 2>/dev/null \
            | grep -o '"executable":"[^"]*datapath[^"]*"' | tail -1 | cut -d'"' -f4)
          echo "running $BIN"
          sudo "$BIN" --include-ignored --test-threads=1

  netns:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev iproute2 curl

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build

      - name: Bring up the namespace rig
        run: sudo ./test/netns-setup.sh

      - name: Attach the load balancer
        run: |
          sudo setsid ip netns exec lb ./target/debug/xdp-lb \
            --config test/config.netns.yaml </dev/null >/tmp/xdp-lb.log 2>&1 &
          for _ in $(seq 30); do
            grep -q "maglev table rebuilt" /tmp/xdp-lb.log && exit 0
            sleep 1
          done
          echo "load balancer never became ready"
          cat /tmp/xdp-lb.log
          exit 1

      - name: Traffic through the VIP
        run: sudo REQUESTS=40 ./test/smoke.sh

      - name: Failover when a backend dies
        run: |
          sudo ./test/backend-down.sh be1
          sleep 5
          sudo REQUESTS=20 ./test/smoke.sh

      - name: Recovery when it returns
        run: |
          sudo ./test/backend-up.sh be1
          sleep 5
          sudo REQUESTS=20 ./test/smoke.sh

      - name: Datapath counters
        run: sudo ip netns exec lb curl -s localhost:9500/metrics | grep xdplb_

      - name: Control plane log
        if: always()
        run: cat /tmp/xdp-lb.log

      - name: Tear down
        if: always()
        run: sudo ./test/netns-teardown.sh
