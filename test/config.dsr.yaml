interface: eth0
metrics_addr: "0.0.0.0:9500"
health_interval_secs: 2
health_timeout_ms: 300

services:
  - name: web
    vip: 10.0.0.100
    port: 80
    protocol: tcp
    forwarding: dsr
    dsr_source: 10.0.0.1
    backends:
      - address: 10.0.0.11
        port: 80
      - address: 10.0.0.12
        port: 80
